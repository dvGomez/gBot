# Checa e gera os instaladores do gBot para macOS e Windows.
#
# - Pull request e push na main: typecheck + instaladores como artefatos da execução (ficam 14 dias).
# - Version tags are handled separately by release.yml, only when explicitly pushed.
# - Dá para rodar à mão em Actions → Build → Run workflow.
name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
            files: dist/*.dmg
          - name: Windows
            os: windows-latest
            target: --win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Gera o instalador
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Sem certificados por enquanto: não procura identidade de assinatura no runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: gBot-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
