name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! Please don't include passwords, tokens or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a workflow with…
        2. Click…
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gBot version
      placeholder: e.g. 0.2.0, or the commit if running from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
