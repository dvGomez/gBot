appId: com.gbot.desktop
productName: gBot
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Sem certificado da Apple por enquanto: o app sai sem assinatura.
  identity: null
dmg:
  artifactName: gBot-${version}-mac-${arch}.dmg
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: gBot-${version}-windows-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
