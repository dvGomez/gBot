appId: com.gbot.desktop
productName: gBot
publish:
  provider: github
  owner: dvGomez
  repo: gBot
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: gBot-${version}-mac-${arch}.${ext}
  # Releases may use MAC_CSC_LINK/MAC_CSC_KEY_PASSWORD; unsigned builds offer manual downloads.
dmg:
  artifactName: gBot-${version}-mac-${arch}.dmg
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: gBot-${version}-windows-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
